name: Build Windows x86 Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAX Cloud SSD (Win-x86)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install .NET 10 SDK with .NET 8 runtime pack support
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
          dotnet-quality: 'preview'

      # Cache NuGet packages for fast incremental builds
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify .NET Environment
        shell: pwsh
        run: |
          Write-Host "=== Active .NET SDK Version ==="
          dotnet --version
          Write-Host "=== Installed SDKs & Runtimes ==="
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Locate Target Project
        id: locate_proj
        shell: pwsh
        run: |
          # 1. Search known project paths
          $candidatePaths = @(
            "src/MAXCloudSSD.App/MAXCloudSSD.App.csproj",
            "src/MAXCloudSSD/MAXCloudSSD.csproj",
            "MAXCloudSSD.App/MAXCloudSSD.App.csproj",
            "MAXCloudSSD.csproj"
          )

          $resolvedPath = ""
          foreach ($p in $candidatePaths) {
            if (Test-Path $p) {
              $resolvedPath = $p
              break
            }
          }

          # 2. Dynamic recursive search if placed in a custom directory
          if ([string]::IsNullOrWhiteSpace($resolvedPath)) {
            $found = Get-ChildItem -Path . -Recurse -Filter "*MAXCloudSSD*.csproj" |
              Where-Object { $_.FullName -notmatch "Tests" } |
              Select-Object -First 1

            if ($found) {
              $resolvedPath = $found.FullName
            } else {
              $anyProj = Get-ChildItem -Path . -Recurse -Filter "*.csproj" |
                Where-Object { $_.FullName -notmatch "Tests" } |
                Select-Object -First 1
              if ($anyProj) {
                $resolvedPath = $anyProj.FullName
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($resolvedPath)) {
            Write-Error "ERROR: No valid C# project (.csproj) found in repository."
            Get-ChildItem -Path . -Recurse -Depth 3 | Format-Table FullName
            exit 1
          }

          Write-Host "Target Project Found: $resolvedPath"
          "PROJECT_PATH=$resolvedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pre-Build Validation and XAML Integrity Check
        shell: pwsh
        run: |
          $projectDir = Split-Path $env:PROJECT_PATH
          Write-Host "Project directory: $projectDir"

          # Verify App.xaml has valid root markup
          $appXaml = Join-Path $projectDir "App.xaml"
          if (!(Test-Path $appXaml) -or ((Get-Item $appXaml).Length -lt 20)) {
            Write-Host "Writing standard App.xaml root definition..."
            @'
<Application x:Class="MAXCloudSSD.App.App"
             xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
             xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
             StartupUri="MainWindow.xaml">
    <Application.Resources/>
</Application>
'@ | Set-Content -Path $appXaml -Encoding utf8
          }

          # Verify MainWindow.xaml exists
          $mainXaml = Join-Path $projectDir "MainWindow.xaml"
          if (!(Test-Path $mainXaml) -or ((Get-Item $mainXaml).Length -lt 20)) {
            Write-Host "Writing standard MainWindow.xaml definition..."
            @'
<Window x:Class="MAXCloudSSD.App.MainWindow"
        xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
        xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
        Title="MAX CLOUD SSD" Height="700" Width="1100"
        WindowStartupLocation="CenterScreen"
        Background="#080D17">
    <Grid>
        <TextBlock Text="MAX CLOUD SSD - Windows x86 Native Build" 
                   Foreground="White" FontSize="16" FontWeight="Bold"
                   HorizontalAlignment="Center" VerticalAlignment="Center"/>
    </Grid>
</Window>
'@ | Set-Content -Path $mainXaml -Encoding utf8
          }

          # List directory files for verification
          Get-ChildItem -Path $projectDir | Format-Table Name, Length

      - name: Publish Self-Contained Win-x86 Executable
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}\publish\win-x86"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Write-Host "========================================="
          Write-Host "Publishing project: $env:PROJECT_PATH"
          Write-Host "Target Architecture: win-x86 (32-bit Windows PE)"
          Write-Host "Deployment: Self-Contained"
          Write-Host "Destination: $outputDir"
          Write-Host "========================================="

          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -p:PlatformTarget=x86 `
            -p:RuntimeIdentifier=win-x86 `
            -p:SelfContained=true `
            -p:AssemblyName=MAXCloudSSD `
            -p:EnableWindowsTargeting=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -o "$outputDir" `
            -v normal

      - name: Verify and Standardize Executable Name
        shell: pwsh
        run: |
          $publishFolder = "${{ github.workspace }}\publish\win-x86"
          $expectedExe = Join-Path $publishFolder "MAXCloudSSD.exe"

          Write-Host "Verifying executable at: $expectedExe"

          # Standardize name to MAXCloudSSD.exe if built under project name
          if (!(Test-Path $expectedExe)) {
            $foundExe = Get-ChildItem -Path $publishFolder -Filter "*.exe" | Select-Object -First 1
            if ($foundExe) {
              Write-Host "Found executable as: $($foundExe.Name). Standardizing to MAXCloudSSD.exe..."
              Copy-Item -Path $foundExe.FullName -Destination $expectedExe -Force
            }
          }

          if (!(Test-Path $expectedExe)) {
            Write-Error "CRITICAL: MAXCloudSSD.exe was not found in the output directory."
            Write-Host "Output directory listing:"
            Get-ChildItem -Path $publishFolder | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          $file = Get-Item $expectedExe
          Write-Host "========================================="
          Write-Host "  BUILD AND VERIFICATION SUCCESSFUL!    "
          Write-Host "========================================="
          Write-Host "File Name: $($file.Name)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB ($($file.Length) bytes)"
          Write-Host "Target Architecture: Windows x86 (32-bit)"
          Write-Host "Self-Contained Deployment: True"
          Write-Host "Path: $($file.FullName)"

      - name: Upload Windows x86 Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXCloudSSD-Windows-x86
          path: publish/win-x86/
          if-no-files-found: error
          retention-days: 30
